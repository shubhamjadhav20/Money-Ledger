packages:
  - packages/*

# Supply-chain hardening (pnpm 12; https://pnpm.io/settings).
# Don't install versions younger than 3 days (minutes).
minimumReleaseAge: 4320
# Fail if a package's publish trust level drops versus earlier releases.
trustPolicy: no-downgrade
# Transitive deps may not come from git URLs or raw tarballs.
blockExoticSubdeps: true
# Dependencies may not run install scripts unless listed below after review.
strictDepBuilds: true
# Reviewed 2026-11-17 (Angular toolchain): each of these has a prebuilt binary or a JS fallback, so
# none needs to run an install script. `false` records the decision and keeps installs quiet.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
engineStrict: true
# pdfjs-dist lists @napi-rs/canvas (a 15 MB native binary) as optional. It is only used to draw
# pages in Node; Ledger reads text only, in the browser, so it is switched off (2026-11-18).
ignoredOptionalDependencies:
  - '@napi-rs/canvas'
# GHSA-fc5q-39xc-vjpf: picomatch <=4.0.7 ReDoS. No patched release exists (npm latest is 4.0.7) and it is
# reachable only through dev tooling (vite, vitest, Angular build); `pnpm audit --prod` is clean.
# TODO: remove this entry once picomatch ships a fix (PLAN.md decision log, 2026-11-18).
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
