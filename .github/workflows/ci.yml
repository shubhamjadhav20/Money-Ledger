name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway Postgres so the production driver (pg) is tested against the real thing.
    # Trust auth is fine: the container lives for this job only and is not reachable from outside.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      # Actions are pinned to full commit SHAs; the comment is the tag. Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm (version from packageManager)
        run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/ledger_test
      - run: pnpm test:web
      - run: pnpm build
      - name: Audit dependencies (fail on high/critical)
        # GHSA-fc5q-39xc-vjpf (picomatch <=4.0.7, ReDoS) has no patched release and is reachable only
        # through dev tooling (vite, vitest, Angular build); `pnpm audit --prod` is clean. TODO: remove
        # the --ignore once picomatch publishes a fix (see PLAN.md decision log, 2026-11-18).
        run: pnpm audit --audit-level high --ignore GHSA-fc5q-39xc-vjpf

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just this push
          persist-credentials: false

      # Pinned release binary, checksum-verified. Same command as the local pre-commit hook.
      - name: Install gitleaks
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "${file}" gitleaks

      - name: Scan history for secrets
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner -v .
